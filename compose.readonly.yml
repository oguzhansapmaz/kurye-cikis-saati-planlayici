services:
  kurye-planlayici:
    build:
      context: .
      dockerfile: Dockerfile
    image: kurye-planlayici:hardened
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
    restart: unless-stopped
